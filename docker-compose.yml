services:
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile.sim
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: gesture-arm/sim:dev
    network_mode: host
    ipc: host
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /ws
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - XAUTHORITY=${XAUTH_FILE}
      - QT_QPA_PLATFORM=xcb
      - ROS_DOMAIN_ID=42
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTH_FILE}:${XAUTH_FILE}:ro
      - ./:/ws
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID}"
      - "${RENDER_GID}"
    command: bash
